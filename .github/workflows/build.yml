name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the portable exe
        shell: cmd
        run: publish.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: FastVitae
          path: publish/FastVitae.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" publish/FastVitae.exe --title "Fast Vitae $version" --notes "Portable Windows app. Download FastVitae.exe, put it in any folder and run it."
